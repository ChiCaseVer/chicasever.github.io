<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChiCaseVer Showcase</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #fff;
        color: #222;
      }
      header {
        text-align: center;
        padding: 40px 20px 10px;
      }
      header h1 {
        font-size: 26px;
        margin-bottom: 10px;
      }
      header p {
        color: #666;
        font-size: 14px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .card {
        border: 1px solid #eee;
        border-radius: 12px;
        overflow: hidden;
        background-color: #fafafa;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        transition: transform 0.2s ease;
      }
      .card:hover {
        transform: translateY(-4px);
      }
      .card img {
        width: 100%;
        height: auto;
        display: block;
      }
      .meta {
        padding: 10px 14px 16px;
      }
      .meta .title {
        font-size: 15px;
        font-weight: bold;
      }
      .price {
        display: inline-block;
        margin-left: 8px;
        padding: 2px 8px;
        border: 1px solid #eee;
        border-radius: 999px;
        font-size: 12px;
        color: #333;
        background: #fafafa;
      }
      footer {
        text-align: center;
        font-size: 14px;
        color: #666;
        margin: 40px 0 20px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>ChiCaseVer Showcase</h1>
      <p>Pure Display | Visual Gallery | For Purchase, Please Visit Our Official Amazon Store “ChiCaseVer”</p>
    </header>

    <div class="gallery">
      <!-- 示例卡片 -->
      <div class="card">
        <img src="https://via.placeholder.com/400x400?text=Case+1" alt="Case 1" />
        <div class="meta">
          <div class="title">BlushPalm</div>
        </div>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/400x400?text=Case+2" alt="Case 2" />
        <div class="meta">
          <div class="title">CitrusCollage</div>
        </div>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/400x400?text=Case+3" alt="Case 3" />
        <div class="meta">
          <div class="title">MarineOcean</div>
        </div>
      </div>
    </div>

    <footer>
      © 2025 ChiCaseVer · All Rights Reserved
    </footer>

    <script>
      const PRICE = '$25.99';
      document.querySelectorAll('.meta .title').forEach(title => {
        if (!title.querySelector('.price')) {
          const tag = document.createElement('span');
          tag.className = 'price';
          tag.textContent = PRICE;
          title.appendChild(tag);
        }
      });
    </script>
  </body>
</html>
